server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: product-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/products/**
        - id: store-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/stores/**
        - id: inventory-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/inventory/**
        - id: cart-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/cart/**
        - id: order-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/orders/**
        - id: payment-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/payments/**
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
app:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-32b}
