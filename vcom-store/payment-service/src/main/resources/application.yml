server:
  port: 8087
spring:
  application:
    name: payment-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/vcom_pmt_db
    username: ${DB_USER:vcom_pmt_user}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update   # use Flyway migrations before production
      show-sql: true
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
app:
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_Td71kiTsXmsmNN}
    key-secret: ${RAZORPAY_KEY_SECRET:yDRYTYB4MAnuvvEfND9f5VlE}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:changeme}
  payment:
    expiry-minutes: 15