server:
  port: 8081
spring:
  application:
    name: auth-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/vcom_auth_db
    username: ${DB_USER:vcom_auth_user}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update   # use Flyway migrations before production
      show-sql: true
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
app:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-32b}
    ttl-minutes: 120
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
